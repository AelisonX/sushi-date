<body>
<canvas id="c" aria-label="Sushi Date game"></canvas>
<script>
(() => {
'use strict';

/* =========================================================

   ========================================================= */
const TEXT = {

  tagline: 'with a very serious robot',

  skip: 'Skip',
  score: 'SCORE',
  best: 'BEST',
  retry: 'Try again',

  girlName: 'YUKI',
  botName: 'BOLT',
  girlEats: 'eats sushi',
  botEats: 'eats hardware',

  booting: 'DINING MODE',
  howTo: 'Drag each plate to the right diner!',
  failBot: 'ORGANIC COMPATIBILITY TEST: FAILED',

  envy: '...can I have it?',
  speedUp: 'SPEED UP!',
  newMenu: 'NEW ON THE MENU!',
  newTag: 'NEW',

    shrimp: 'Shrimp Nigiri', ikura: 'Ikura Gunkan',
    screw: 'Screw Gunkan', battery: 'Lithium Tamago', ram: 'RAM Maki',
    usb: 'USB Tempura', bearing: 'Ball-Bearing Gunkan',
    unagi: 'Unagi Nigiri', hotate: 'Scallop Nigiri', kappa: 'Cucumber Maki', inari: 'Inari Pocket',
    gear: 'Gear Nigiri', spring: 'Spring Gunkan', led: 'LED Ikura', cable: 'Cable Maki'
  }
};

/* ========================= setup ========================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 800;
let H = 1000, scale = 1, offX = 0, offY = 0, dpr = 1;
let view = { l: 0, t: 0, r: 800, b: 1000 };
let tableY, seatY, beltY, beltTop, beltBot, beamY, CS = 1, PS = 1, PLATE_HW = 66, U = 1, TOPI = 0;
const girlX = 215, botX = 585;
let zones = {};

function layout() {
  // extra height on tall (phone) screens goes into bigger diners, a bigger belt and plates
  const E = Math.max(0, Math.min(500, H - 1000)), k = E / 500;
  PS = 1 + k * 0.4;           // plate / belt scale
  CS = 1 + k * 0.45;          // character scale
  PLATE_HW = 66 * PS;
  beltBot = H - (110 + E * 0.08);
  beltTop = beltBot - 132 * PS;
  beltY = (beltTop + beltBot) / 2 + 4 * PS;
  tableY = beltTop - 138 - E * 0.04;
  seatY = tableY + 12;
  beamY = tableY - 520 * CS;
  zones = {
    girl: { x: 40, y: tableY - 320 * CS, w: 345, h: 320 * CS + 75 },
    bot:  { x: 415, y: tableY - 320 * CS, w: 345, h: 320 * CS + 75 }
  };
}
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const vw = window.innerWidth, vh = window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  H = Math.max(1000, Math.min(1750, W * vh / vw));
  scale = Math.min(vw / W, vh / H);
  offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
  view = { l: -offX / scale, t: -offY / scale, r: (vw - offX) / scale, b: (vh - offY) / scale };
  const coarse = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
  U = (coarse || scale < 0.7) ? 1.4 : 1;          // bigger buttons on phones
  TOPI = coarse ? 58 / scale : 0;                  // keep HUD clear of app top bars
  layout();
}
window.addEventListener('resize', resize);
resize();

/* ========================= utils ========================= */
const OUT = '#4b302b';
const FONT = '"Baloo 2","Nunito","Varela Round","Trebuchet MS",ui-rounded,system-ui,sans-serif';
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
const easeBack = t => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function rr(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function ell(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2); }
function fs(fill, stroke, lw) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 3; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function line(x1, y1, x2, y2, col, lw) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke();
}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.2, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.2, x + s * 1.4, y - s * 0.1, x, y + s * 0.9);
  ctx.closePath();
}
function starPath(x, y, r, pts, inner) {
  ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / pts, rad = i % 2 ? r * (inner || 0.45) : r;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function sparkle(x, y, s, col) {
  ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.quadraticCurveTo(x, y, x + s, y);
  ctx.quadraticCurveTo(x, y, x, y + s); ctx.quadraticCurveTo(x, y, x - s, y);
  ctx.quadraticCurveTo(x, y, x, y - s); ctx.closePath();
  ctx.fillStyle = col || '#fffbe0'; ctx.fill();
}
function text(str, x, y, size, col, align, weight) {
  ctx.font = `${weight || 800} ${size}px ${FONT}`;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = col; ctx.fillText(str, x, y);
}
function wrapLines(str, maxW) {
  const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ========================= storage ========================= */
function load(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let best = load('sushiDate.best', 0) | 0;
let muted = !!load('sushiDate.muted', false);

/* ========================= audio ========================= */
let actx = null, master = null;
function ensureAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.55; master.connect(actx.destination);
    } catch (e) { actx = null; }
  }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, d, o) {
  o = o || {};
  if (muted || !actx) return;
  const t0 = actx.currentTime + (o.delay || 0);
  const osc = actx.createOscillator(), g = actx.createGain();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(f, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + d);
  const v = o.vol || 0.18;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(v, t0 + (o.attack || 0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  osc.connect(g); g.connect(master);
  osc.start(t0); osc.stop(t0 + d + 0.05);
}
function noise(d, o) {
  o = o || {};
  if (muted || !actx) return;
  const t0 = actx.currentTime + (o.delay || 0);
  const len = Math.max(1, Math.floor(actx.sampleRate * d));
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource(); src.buffer = buf;
  const filt = actx.createBiquadFilter(); filt.type = o.filter || 'bandpass';
  filt.frequency.setValueAtTime(o.freq || 1200, t0);
  if (o.to) filt.frequency.exponentialRampToValueAtTime(o.to, t0 + d);
  filt.Q.value = o.q || 1;
  const g = actx.createGain();
  g.gain.setValueAtTime(o.vol || 0.2, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  src.connect(filt); filt.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + d + 0.05);
}
const SFX = {
  click() { tone(660, 0.07, { type: 'triangle', vol: 0.14 }); },
  pick() { tone(520, 0.09, { type: 'triangle', to: 820, vol: 0.14 }); },
  ret() { tone(420, 0.12, { type: 'triangle', to: 250, vol: 0.12 }); },
  chomp() { noise(0.06, { freq: 700, vol: 0.22, q: 0.8 }); noise(0.06, { freq: 900, vol: 0.18, delay: 0.13 }); },
  yumGirl() { tone(784, 0.12, { vol: 0.16 }); tone(1046, 0.2, { vol: 0.16, delay: 0.1 }); },
  yumBot() { [0, 0.06, 0.12].forEach((d, i) => tone(620 + i * 230, 0.05, { type: 'square', vol: 0.06, delay: d })); tone(1500, 0.16, { delay: 0.2, vol: 0.09 }); },
  crunch() { for (let i = 0; i < 3; i++) noise(0.05, { freq: 2500, vol: 0.15, q: 3, delay: i * 0.08 }); },
  boot() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.09, { type: 'square', vol: 0.05, delay: i * 0.12 })); },
  ding() { tone(1318, 0.5, { vol: 0.14 }); tone(1976, 0.4, { vol: 0.06, delay: 0.02 }); },
  beltStart() { tone(110, 0.4, { type: 'sawtooth', to: 160, vol: 0.05 }); },
  glitch() {
    for (let i = 0; i < 7; i++) {
      tone(rand(200, 1600), 0.05, { type: 'square', vol: 0.06, delay: i * 0.07 });
      noise(0.04, { freq: rand(800, 4000), vol: 0.12, q: 4, delay: i * 0.07 + 0.03 });
    }
  },
  powerDown() { tone(520, 1.1, { type: 'sawtooth', to: 38, vol: 0.1 }); },
  hiss() { noise(0.9, { freq: 3000, to: 1200, vol: 0.06, filter: 'highpass' }); },
  huh() { tone(330, 0.25, { type: 'triangle', to: 300, vol: 0.1 }); },
  scratch() { noise(0.35, { freq: 400, to: 3000, vol: 0.25, q: 2 }); tone(150, 0.4, { type: 'sawtooth', vol: 0.1, delay: 0.08 }); },
  dunDun() { tone(220, 0.35, { type: 'triangle', vol: 0.16 }); tone(160, 0.7, { type: 'triangle', vol: 0.16, delay: 0.45 }); },
  cricket() { for (let i = 0; i < 3; i++) tone(4300, 0.035, { vol: 0.05, delay: i * 0.09 }); },
  panel() { tone(392, 0.12, { type: 'triangle', vol: 0.1 }); tone(523, 0.18, { type: 'triangle', vol: 0.1, delay: 0.1 }); },
  newBest() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, { type: 'triangle', vol: 0.12, delay: 0.15 + i * 0.09 })); }
};

/* ========================= food ========================= */
function rice() {
  rr(-40, -22, 80, 27, 13); fs('#fffaf0', OUT, 3);
  ctx.fillStyle = '#ece2cf';
  [[-26, -8], [-12, -4], [4, -9], [18, -5], [30, -10], [-4, -14]].forEach(p => { ell(p[0], p[1], 3.2, 2, 0.3); ctx.fill(); });
}
function nori() {
  rr(-35, -36, 70, 42, 12); fs('#24382f', OUT, 3);
  rr(-27, -28, 7, 26, 3); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
  ell(0, -36, 33, 9); fs('#16261f', OUT, 2.5);
}
function noriBand(x) { rr(x - 9, -50, 18, 54, 3); fs('#24382f', OUT, 2.5); }
function chrome(x, y, r) {
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#d5dce4'); g.addColorStop(1, '#5f6b77');
  ell(x, y, r, r); fs(g, '#38404a', 2);
}
function screwHead(x, y, r) {
  chrome(x, y, r);
  line(x - r * 0.55, y, x + r * 0.55, y, '#4a545e', 2.4);
  line(x, y - r * 0.55, x, y + r * 0.55, '#4a545e', 2.4);
}

  ikura: { type: 'human', draw() {

    [[-18, -40], [-4, -42], [10, -40], [-11, -51], [4, -53], [-24, -48], [17, -50], [-3, -63]].forEach(p => {
      const g = ctx.createRadialGradient(p[0] - 2, p[1] - 2, 1, p[0], p[1], 8);

    for (let i = 0; i < 5; i++) line(-5, -26 + i * 5, 5, -23 + i * 5, '#58626d', 1.6);
    ell(0, -31, 11, 5); fs('#dfe4ea', '#38404a', 2);

  bearing: { type: 'bot', draw() {

    ell(20, -46, 14, 9); fs('#aab4bf', '#38404a', 2); ell(20, -46, 6, 3.5); fs('#1b2a22', '#38404a', 1.5);
    [[-18, -40], [-3, -42], [10, -39], [-11, -52], [4, -55], [-25, -49], [-4, -65]].forEach(p => chrome(p[0], p[1], 8.5));

    fs('#ffe14d', OUT, 1.5);

  ram: { type: 'bot', draw() {
    [-25, 25].forEach(x => {
      rr(x - 25, -38, 50, 34, 10); fs('#24382f', OUT, 3);

      ctx.fillStyle = OUT; bumps.forEach(b => { ell(b[0], b[1], b[2] + 2.5, b[2] + 2.5); ctx.fill(); });
      ctx.fillStyle = '#f3b54a'; bumps.forEach(b => { ell(b[0], b[1], b[2], b[2]); ctx.fill(); });
      ctx.fillStyle = '#d98a2a'; [[-6, -2], [5, 4], [-2, 9], [8, -6], [-10, 5]].forEach(c => { ell(c[0], c[1], 2.2, 2.2); ctx.fill(); });

  // ---- tier 2 / 3 menu (unlocked during a run) ----

    for (let i = 0; i < 5; i++) line(-36 + i * 18, -44, -30 + i * 18, -20, 'rgba(60,20,5,0.45)', 3);

/* ========================= game state ========================= */
let state = 'title';        // title | intro | play | fail
let now = 0, introT = 0, playT = 0, failT = 0;
let score = 0, newBest = false, failKind = null, failPlate = null;
let plates = [], plateId = 0, beltOffset = 0, speed = 0, distSince = 0, nextGap = 0;
let lastTypes = [], lastFood = null;
let drag = null;             // { plate, pointerId, offX, offY, tox, toy }
let hoverZone = null;
let girlEat = -1, botEat = -1, girlChew = 0, botChew = 0;
let fired = {};
let hasPlayedIntro = false;
const debug = { noSpawn: false };
let seenFoods = new Set(), toast = null, lastLevel = 0, lastTier = 0;

// belt speed (px/s): calm for ~4 s, then keeps climbing; hard cap keeps it physically playable
const speedAt = e => { const t = Math.max(0, e - 4); return Math.min(650, 140 + 7 * t + 0.04 * t * t); };
// seconds between plates: shrinks steadily, floor 0.45 s
const intervalAt = e => Math.max(0.45, 2.2 * Math.exp(-Math.max(0, e - 4) / 24));
const gapAt = e => intervalAt(e) * speedAt(e);

function chooseFood() {
  let type = Math.random() < 0.5 ? 'human' : 'bot';
  if (lastTypes.length >= 3 && lastTypes.slice(-3).every(t => t === lastTypes[lastTypes.length - 1])) {
    type = lastTypes[lastTypes.length - 1] === 'human' ? 'bot' : 'human';
  }
  const pool = unlockedPool(type, playT).filter(id => id !== lastFood);
  const id = pick(pool);
  lastTypes.push(type); if (lastTypes.length > 6) lastTypes.shift();
  lastFood = id;
  return id;
}
function spawnPlate(id, x) {
  const food = id || chooseFood();
  const isNew = state === 'play' && tierOf(food) > 0 && !seenFoods.has(food);
  seenFoods.add(food);
  const p = { id: ++plateId, food, isNew, x: x === undefined ? -PLATE_HW - 6 : x, state: 'belt', dx: 0, dy: 0, t: 0, from: null };
  plates.push(p);
  return p;
}
function platePos(p) {
  if (p.state === 'drag') return { x: p.dx, y: p.dy, s: 1.12 * PS };
  if (p.state === 'return') {
    const k = easeOut(p.t / 0.2);
    return { x: lerp(p.from.x, p.x, k), y: lerp(p.from.y, beltY, k), s: lerp(1.12 * PS, PS, k) };
  }
  if (p.state === 'fly') {
    const k = easeOut(p.t / 0.18);
    return { x: lerp(p.from.x, p.to.x, k), y: lerp(p.from.y, p.to.y, k), s: lerp(1.1 * PS, 0.35, k) };
  }
  return { x: p.x, y: beltY, s: PS };
}
function resetRun() {
  plates = []; parts = []; score = 0; newBest = false; failKind = null; failPlate = null;
  beltOffset = 0; playT = 0; failT = 0; distSince = 0; nextGap = 0;
  drag = null; hoverZone = null; girlEat = -1; botEat = -1; fired = {};
  lastTypes = []; lastFood = null; seenFoods = new Set(); toast = null; lastLevel = 0; lastTier = 0;
  speed = speedAt(0);
}
function startIntro() {
  resetRun(); state = 'intro'; introT = 0; speed = 0; SFX.click();
}
function startPlay(skipped) {
  if (skipped || state !== 'intro') {
    resetRun();
    spawnPlate();
  }
  state = 'play'; playT = 0; hasPlayedIntro = true;
  speed = speedAt(0);
  nextGap = gapAt(0);
  distSince = 0;
}
function retry() {
  SFX.click();
  resetRun();
  state = 'play'; playT = 0;
  spawnPlate();
  nextGap = gapAt(0); distSince = 0;
}
function fail(kind, plate) {
  if (state !== 'play') return;
  state = 'fail'; failKind = kind; failPlate = plate; failT = 0; fired = {};
  if (drag && drag.plate !== plate) {
    const dp = drag.plate; const pos = platePos(dp);

  }
  if (failKind === 'miss' && t > 1.9) {
    bubble(400, seatY - 300 * CS, TEXT.failMiss, { tails: [[girlX + 50, seatY - 262 * CS], [botX - 50, seatY - 280 * CS]], size: 28, maxW: 480, pop: easeBack(seg(t, 1.9, 2.15)) });
  }
}

let buttons = {};
function drawButton(key, x, y, w, h, label, col, size) {
  const hover = buttons._press === key;
  rr(x - w / 2, y - h / 2 + 5, w, h, h / 2); ctx.fillStyle = 'rgba(75,48,43,0.9)'; ctx.fill();
  rr(x - w / 2, y - h / 2 + (hover ? 4 : 0), w, h, h / 2); fs(col, OUT, 3.5);
  text(label, x, y + (hover ? 4 : 0) + 2, size || 26, '#ffffff');
  buttons[key] = { x: x - w / 2, y: y - h / 2, w, h };
}
function drawMute(x, y, u) {
  ctx.save(); ctx.translate(x, y); ctx.scale(u, u); ctx.translate(-x, -y);
  ell(x, y, 26, 26); fs('#fff4e2', OUT, 3);
  ctx.beginPath(); ctx.moveTo(x - 13, y - 6); ctx.lineTo(x - 6, y - 6); ctx.lineTo(x + 3, y - 14); ctx.lineTo(x + 3, y + 14); ctx.lineTo(x - 6, y + 6); ctx.lineTo(x - 13, y + 6); ctx.closePath();
  fs('#5a3a2c');
  if (muted) { line(x + 8, y - 7, x + 18, y + 7, '#e8513f', 3.5); line(x + 18, y - 7, x + 8, y + 7, '#e8513f', 3.5); }
  else {
    ctx.strokeStyle = '#5a3a2c'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x + 4, y, 8, -0.9, 0.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 4, y, 14, -0.9, 0.9); ctx.stroke();
  }
  ctx.restore();
  buttons.mute = { x: x - 34 * u, y: y - 34 * u, w: 68 * u, h: 68 * u };
}
function drawHUD() {
  buttons = { _press: buttons._press };
  const top = view.t + TOPI + 14, u = U;
  if (state === 'play' || state === 'fail') {
    ctx.save(); ctx.translate(16, top); ctx.scale(u, u); ctx.translate(-16, -top);
    rr(16, top, 146, 64, 16); fs('#fff4e2', OUT, 3);
    text(TEXT.score, 89, top + 17, 14, '#a3402f');
    text(String(score), 89, top + 44, 34, '#5a3a2c');
    rr(26, top + 66, 126, 28, 10); fs('#f0d7b4', OUT, 2.5);
    text(`${TEXT.best} ${best}`, 89, top + 81, 15, '#5a3a2c');
    ctx.restore();
  }
  drawMute(W - 16 - 30 * u, top + 32 * u, u);
  if (state === 'intro') drawButton('skip', W - 16 - 58 * u, top + 104 * u, 116 * u, 46 * u, TEXT.skip + ' ▸', '#7a9bd0', 20 * u);
}
function drawOverlays() {
  if (state === 'title') {
    ctx.fillStyle = 'rgba(60,35,25,0.25)'; ctx.fillRect(view.l, view.t, view.r - view.l, view.b - view.t);
    const cy = tableY - 220;
    const bob = Math.sin(now * 2) * 4;
    ctx.save(); ctx.translate(0, bob);
    line(300, cy - 170, 300, cy - 130, OUT, 3); line(500, cy - 170, 500, cy - 130, OUT, 3);
    rr(150, cy - 135, 500, 270, 26); fs('#fff4dd', OUT, 5);
    rr(166, cy - 119, 468, 238, 18); ctx.strokeStyle = '#e3b980'; ctx.lineWidth = 3; ctx.stroke();
    text(TEXT.title, 400, cy - 58, 72, '#a3402f');
    text(TEXT.tagline, 400, cy + 2, 24, '#8a6a55', 'center', 700);
    drawDish('salmon', 290, cy + 78, 0.62); drawDish('screw', 510, cy + 78, 0.62);
    heartPath(400, cy + 62, 14); fs('#ff6fa8', OUT, 2.5);
    ctx.restore();
    drawButton('start', 400, cy + 160 + 50 * U, 260 * U, 74 * U, TEXT.start, '#f0703f', 32 * U);
    if (best > 0) text(`${TEXT.best}: ${best}`, 400, cy + 180 + 100 * U, 22 * U, '#fff4dd');
  }
  if (state === 'intro') {
    const a = 1 - seg(introT, 0, 0.5);
    if (a > 0) { ctx.fillStyle = `rgba(40,20,10,${a})`; ctx.fillRect(view.l, view.t, view.r - view.l, view.b - view.t); }
  }
  if (state === 'fail' && failT >= panelAt()) {
    const k = easeBack(seg(failT, panelAt(), panelAt() + 0.4));
    const u = U, ph = 250, ptop = view.b - ph * u - 30 + (1 - k) * 120, top = 0;
    ctx.save(); ctx.translate(400, ptop); ctx.scale(u, u); ctx.translate(-400, 0);
    ctx.save(); ctx.globalAlpha = clamp(k * 1.5, 0, 1);
    rr(130, top + 8, 540, ph, 28); ctx.fillStyle = 'rgba(60,30,20,0.35)'; ctx.fill();
    rr(130, top, 540, ph, 28); fs('#fff4dd', OUT, 4.5);
    const title = failKind === 'bot' ? TEXT.titleBot : failKind === 'girl' ? TEXT.titleGirl : TEXT.titleMiss;
    text(title, 400, top + 40, 28, '#a3402f');
    text(TEXT.score, 300, top + 84, 16, '#8a6a55');
    text(String(score), 300, top + 124, 54, '#5a3a2c');
    text(TEXT.best, 500, top + 84, 16, '#8a6a55');
    text(String(best), 500, top + 124, 54, '#5a3a2c');
    if (newBest) {
      ctx.save(); ctx.translate(598, top + 122); ctx.rotate(-0.12);
      rr(-62, -16, 124, 32, 10); fs('#ffb020', OUT, 3); text(TEXT.newBest, 0, 1, 18, '#fff');
      ctx.restore();
    }
    ctx.restore();
    if (k > 0.6) drawButton('retry', 400, top + 196, 250, 64, '↻ ' + TEXT.retry, '#f0703f', 28);
    ctx.restore();
    if (buttons.retry) buttons.retry = { x: 400 - 125 * u, y: ptop + 164 * u, w: 250 * u, h: 64 * u };
  }
}

/* ========================= input ========================= */
function toLogical(e) {
  const rect = cv.getBoundingClientRect();
  return { x: (e.clientX - rect.left - offX) / scale, y: (e.clientY - rect.top - offY) / scale };
}
function inBtn(b, p) { return b && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }
function plateAt(p) {
  for (let i = plates.length - 1; i >= 0; i--) {
    const pl = plates[i];
    if (pl.state !== 'belt' && pl.state !== 'return') continue;
    const pos = platePos(pl);
    if (Math.abs(p.x - pos.x) < 82 * PS && p.y > pos.y - 100 * PS && p.y < pos.y + 62 * PS) return pl;
  }
  return null;
}
function toggleMute() {
  muted = !muted; save('sushiDate.muted', muted);
  if (!muted) { ensureAudio(); SFX.click(); }
}

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  const p = toLogical(e);
  if (inBtn(buttons.mute, p)) { toggleMute(); return; }
  if (state === 'title') { startIntro(); return; }
  if (state === 'intro') { if (inBtn(buttons.skip, p)) { SFX.click(); startPlay(true); } return; }
  if (state === 'fail') { if (inBtn(buttons.retry, p)) { buttons._press = 'retry'; setTimeout(() => { buttons._press = null; }, 120); retry(); } return; }
  if (state === 'play') {
    const touch = e.pointerType !== 'mouse';
    if (drag) {
      if (!drag.held) return;        // one plate at a time; ignore extra fingers
      // a plate is being held (picked up with a tap): tap a diner to feed, or grab it again
      const pl = drag.plate, z = zoneAt(p.x, p.y);
      if (z) { pl.dx = p.x; pl.dy = p.y; drag = null; hoverZone = null; dropPlate(pl); return; }
      Object.assign(drag, { held: false, pointerId: e.pointerId, px: p.x, py: p.y, sx: p.x, sy: p.y, moved: 0, downT: now,
        offX: pl.dx - p.x, offY: pl.dy - p.y, tox: touch ? 0 : pl.dx - p.x, toy: touch ? -44 * PS : pl.dy - p.y });
      try { cv.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    const pl = plateAt(p);
    if (!pl) return;
    const pos = platePos(pl);
    pl.state = 'drag';
    drag = { plate: pl, pointerId: e.pointerId, held: false, px: p.x, py: p.y, sx: p.x, sy: p.y, moved: 0, downT: now,
      offX: pos.x - p.x, offY: pos.y - p.y, tox: touch ? 0 : pos.x - p.x, toy: touch ? -44 * PS : pos.y - p.y };
    pl.dx = pos.x; pl.dy = pos.y;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    SFX.pick();
  }
}, { passive: false });
cv.addEventListener('pointermove', e => {
  e.preventDefault();
  if (drag && e.pointerId === drag.pointerId) {
    const p = toLogical(e); drag.px = p.x; drag.py = p.y;
    drag.moved = Math.max(drag.moved, Math.hypot(p.x - drag.sx, p.y - drag.sy));
    drag.plate.dx = p.x + drag.offX; drag.plate.dy = p.y + drag.offY;
  }
}, { passive: false });
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.pointerId) return;
  const pl = drag.plate;
  if (!cancel) {
    const p = toLogical(e); drag.px = p.x; drag.py = p.y;
    drag.moved = Math.max(drag.moved, Math.hypot(p.x - drag.sx, p.y - drag.sy));
    // a quick tap (no real drag) keeps the plate in hand instead of dropping it back
    if (state === 'play' && drag.moved < 30 && now - drag.downT < 0.35) {
      drag.held = true; drag.pointerId = null; hoverZone = null;
      return;
    }
    pl.dx = p.x + drag.offX; pl.dy = p.y + drag.offY;
  }
  drag = null; hoverZone = null;
  if (state !== 'play') return;
  if (cancel) { pl.state = 'return'; pl.t = 0; pl.from = { x: pl.dx, y: pl.dy }; return; }
  dropPlate(pl);
}
cv.addEventListener('pointerup', e => { e.preventDefault(); endDrag(e, false); }, { passive: false });
cv.addEventListener('pointercancel', e => endDrag(e, true));
cv.addEventListener('lostpointercapture', e => { if (drag && e.pointerId === drag.pointerId) endDrag(e, false); });
cv.addEventListener('contextmenu', e => e.preventDefault());
['touchstart', 'touchmove', 'touchend', 'gesturestart', 'dblclick'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
window.addEventListener('keydown', e => {
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === ' ' || e.key === 'Enter') {
    ensureAudio();
    if (state === 'title') startIntro();
    else if (state === 'intro') startPlay(true);
    else if (state === 'fail' && failT >= panelAt() + 0.3) retry();
  }
});
document.addEventListener('visibilitychange', () => { lastTs = performance.now(); });

/* ========================= loop ========================= */
let lastTs = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
  lastTs = ts;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// tiny debug/test hook (harmless in production)
window.__sushi = {
  debug,
  info: () => ({ state, score, best, failKind, failT, playT, speed, introT, plates: plates.map(p => ({ id: p.id, food: p.food, type: FOODS[p.food].type, x: p.x, state: p.state })), drag: !!drag, scrollY: window.scrollY }),
  spawn: (food, x) => spawnPlate(food, x).id,
  clear: () => { plates = []; },
  toScreen: (x, y) => ({ x: offX + x * scale, y: offY + y * scale }),
  layout: () => ({ beltY, tableY, seatY, girlX, botX, zones, W, H }),
  setPlayT: t => { playT = t; },
  buttons: () => buttons
};
})();
</script>
</body>
